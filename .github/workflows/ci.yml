name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24, latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - run: npm ci --prefer-offline --no-audit
      - run: npm run tsc
      - run: npm test
      - run: npm run build

  sidecar:
    name: libtorrent sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # The sidecar cannot be exercised without libtorrent present, so install
      # it rather than leave the one non-JS component untested.
      - run: pip install libtorrent
      - run: python -m py_compile sidecar/libtorrent_sidecar.py
      # The sidecar's own unit tests. They existed and nothing ran them, so a
      # regression in the one component CI installs libtorrent for was the one
      # regression CI could not catch.
      - run: npm run test:sidecar
      - name: Smoke test the protocol
        run: |
          echo '{"id":1,"op":"version","params":{}}' | python sidecar/libtorrent_sidecar.py | tail -1 | tee /dev/stderr | grep -q '"ok": *true'
