name: Create bump version PR

# Mirrors the tileserver-gl process: a manual dispatch bumps the version and
# opens a PR, and merging that PR is what makes the release real. Nothing
# publishes from here, so a mistaken bump costs a closed PR rather than an
# unpublishable version burned on npm.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump type.
        required: true
        type: choice
        options:
          - prerelease
          - prepatch
          - preminor
          - premajor
          - patch
          - minor
          - major
      preid:
        description: Prerelease identifier (e.g. 'alpha', 'beta', 'rc'). Only used with prerelease types.
        required: false
        type: string
        default: 'pre'

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version-pr:
    name: Bump version PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup node env 📦
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true

      - name: Bump version and update changelog
        id: version-details
        run: |
          if [ -n "${{ inputs.preid }}" ]; then
            npm version --commit-hooks false --git-tag-version false \
              --preid=${{ inputs.preid }} ${{ inputs.version }}
          else
            npm version --commit-hooks false --git-tag-version false ${{ inputs.version }}
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Promote the running "## master" section to the new version and
          # start a fresh one, so the changelog is always ready to be added to.
          if [ -f CHANGELOG.md ]; then
            node -e "
              const fs = require('fs');
              const version = process.argv[1];
              let log = fs.readFileSync('CHANGELOG.md', 'utf8');
              log = log.replace('## master', '## ' + version);
              log = log.replaceAll('- _...Add new stuff here..._\n', '');
              const fresh = [
                '## master',
                '### ✨ Features and improvements',
                '- _...Add new stuff here..._',
                '',
                '### 🐞 Bug fixes',
                '- _...Add new stuff here..._',
                '',
                '',
              ].join('\n');
              const title = log.match(/^(# .+?\n\n)/);
              log = title
                ? title[1] + fresh + log.slice(title[1].length)
                : fresh + log;
              fs.writeFileSync('CHANGELOG.md', log);
            " "$VERSION"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Release v${{ steps.version-details.outputs.version }}
          branch: release-v${{ steps.version-details.outputs.version }}
          title: Release v${{ steps.version-details.outputs.version }}
          body: |
            Automated version bump to `v${{ steps.version-details.outputs.version }}`.

            **Merging this publishes to npm.** The release workflow runs on push
            to `main`, sees this version is not on the registry yet, and
            publishes it — then creates the
            `v${{ steps.version-details.outputs.version }}` tag and GitHub
            Release.
