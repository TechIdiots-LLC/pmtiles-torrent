name: Release

# Fires when a release is published. The dist-tag follows the version, so a
# prerelease lands under "next" and cannot be installed by an unsuspecting
# `npm install pmtiles-torrent`.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC, for npm trusted publishing and provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Matches the trusted-publisher configuration on npmjs.com: npm rejects the
    # OIDC token unless the workflow ran in this environment, so a workflow
    # edited on another branch cannot publish. It is also where publish
    # protection rules (required reviewers, allowed branches) belong.
    environment: release
    steps:
      - uses: actions/checkout@v6

      - name: Setup node env 📦
        uses: actions/setup-node@v6
        with:
          # Pinned rather than read from engines.node: trusted publishing needs
          # npm 11.5.1+, which ships with Node 22.14+.
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Typecheck, test and build
        run: |
          npm run tsc
          npm test
          npm run build

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Choose dist-tag
        id: disttag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # A version carrying a prerelease identifier must not become "latest",
          # or everyone installing the package gets it by default.
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure npm supports trusted publishing
        run: |
          # Trusted publishing exchanges the workflow's OIDC token for
          # short-lived credentials, and needs npm 11.5.1 or newer. Older npm
          # ignores the token and then fails on missing auth, which is a
          # confusing way to discover the version is wrong.
          echo "npm $(npm --version)"
          node -e "process.exit(require('semver').gte(process.argv[1],'11.5.1')?0:1)" "$(npm --version)" 2>/dev/null || npm install -g npm@latest
          echo "publishing with npm $(npm --version)"

      - name: Publish
        # No NODE_AUTH_TOKEN: authentication comes from the OIDC token above,
        # once this repo and workflow filename are registered as a trusted
        # publisher for the package on npmjs.com. To use a classic token
        # instead, delete this comment and add:
        #   env:
        #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag ${{ steps.disttag.outputs.tag }}
