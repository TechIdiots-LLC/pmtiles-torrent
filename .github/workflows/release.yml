name: Release

# Fires when a release is published. The dist-tag follows the version, so a
# prerelease lands under "next" and cannot be installed by an unsuspecting
# `npm install pmtiles-torrent`.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup node env 📦
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Typecheck, test and build
        run: |
          npm run tsc
          npm test
          npm run build

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Choose dist-tag
        id: disttag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # A version carrying a prerelease identifier must not become "latest",
          # or everyone installing the package gets it by default.
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: npm publish --access public --provenance --tag ${{ steps.disttag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
