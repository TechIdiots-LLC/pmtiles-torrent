<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pmtiles-torrent in maplibre-gl-js</title>
    <link href="https://unpkg.com/maplibre-gl@6/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; font: 13px/1.5 system-ui, sans-serif; }
      #map { position: absolute; inset: 0; }
      #panel {
        position: absolute; top: 10px; left: 10px; z-index: 1; width: 23rem;
        background: rgba(255, 255, 255, 0.94); border-radius: 6px; padding: 0.7rem 0.9rem;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      #panel h1 { font-size: 14px; margin: 0 0 0.2rem; }
      #transport { margin: 0 0 0.5rem; color: #666; }
      #transport a { color: #06c; }
      #panel dl { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.6rem; margin: 0; }
      #panel dt { color: #666; }
      #panel dd { margin: 0; font-variant-numeric: tabular-nums; }
      #log { margin-top: 0.6rem; max-height: 9rem; overflow: auto; font-size: 12px; color: #444; }
      #log div { border-top: 1px solid #eee; padding: 0.15rem 0; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <h1>pmtiles-torrent — maplibre-gl-js</h1>
      <p id="transport"></p>
      <dl>
        <dt>peers</dt><dd id="peers">—</dd>
        <dt>from swarm</dt><dd id="down">—</dd>
        <dt>seeded back</dt><dd id="up">—</dd>
        <dt>cache</dt><dd id="cache">—</dd>
      </dl>
      <div id="log"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "maplibre-gl": "https://esm.sh/maplibre-gl@6",
          "pmtiles": "https://esm.sh/pmtiles@4",
          "webtorrent": "https://esm.sh/webtorrent@3"
        }
      }
    </script>

    <script type="module">
      import maplibregl from 'maplibre-gl';
      import { PMTiles, Protocol } from 'pmtiles';
      import WebTorrent from 'webtorrent';
      // Built from this repository: `npm run build` first.
      import { TorrentSource } from '../../dist/esm/index.js';
      import { WebTorrentEngine } from '../../dist/esm/webtorrent.js';

      // ---------------------------------------------------------------------
      // The only things you should need to change.
      //
      // ARCHIVE_URL is where the .pmtiles file is served over HTTP. MAGNET is
      // the same archive in the swarm — copy both from a pmtiles-swarm console,
      // or from the `torrent` block of any TileJSON it serves.
      //
      // Note the wss:// tracker. A browser speaks WebRTC only — it cannot reach
      // TCP or uTP peers at all — so without a websocket tracker it will find
      // nobody, however healthy the swarm looks elsewhere.
      // ---------------------------------------------------------------------
      const ARCHIVE_URL = 'https://swarm.example.org/files/example.pmtiles';
      const MAGNET =
        'magnet:?xt=urn:btih:0000000000000000000000000000000000000000' +
        '&dn=example.pmtiles' +
        '&tr=' + encodeURIComponent('wss://tracker.openwebtorrent.com') +
        '&ws=' + encodeURIComponent(ARCHIVE_URL);

      // One string names the archive both ways: the HTTP URL, and the magnet in
      // the fragment. A fragment is never sent in a request, so the URL stays a
      // perfectly ordinary archive URL to anything that does not look at it.
      const SOURCE_URL = `${ARCHIVE_URL}#${MAGNET}`;

      // Add ?http to the page URL to skip the swarm entirely. Same style, same
      // source URL, no code changes — which is the point of the section below.
      const useTorrent = !new URLSearchParams(location.search).has('http');

      const log = (message) => {
        const line = document.createElement('div');
        line.textContent = message;
        document.getElementById('log').prepend(line);
      };

      // ---------------------------------------------------------------------
      // The whole integration.
      //
      // TorrentSource implements the pmtiles Source interface, so it drops into
      // the PMTiles library in place of the FetchSource it would otherwise
      // build for itself. Nothing here is tile-aware: the archive is one file
      // and PMTiles resolves a tile to a byte range, which the swarm serves as
      // readily as a web server does.
      //
      // The registration is what makes it a drop-in rather than a replacement.
      // Protocol.add() keys an instance by source.getKey(), and the protocol
      // handler looks up whatever follows `pmtiles://` before constructing
      // anything. Register under that exact string and the torrent source wins;
      // do not register, and the same URL loads over HTTP with no other
      // difference. That is why `key` is set to SOURCE_URL, fragment included —
      // a key that does not match character-for-character does not error, it
      // silently falls back to HTTP.
      // ---------------------------------------------------------------------
      const protocol = new Protocol({ metadata: true });
      maplibregl.addProtocol('pmtiles', protocol.tile);

      let client = null;
      let source = null;

      if (useTorrent) {
        // One client for the page. Sharing it matters as soon as there is more
        // than one archive: one peer pool, one set of connections.
        client = new WebTorrent();
        client.on('error', (error) => log(`client: ${error.message}`));

        const engine = new WebTorrentEngine(MAGNET, {
          client,
          // Deliberately no `resumePath`. It is the only part of this engine
          // that touches node:fs, and leaving it unset is what makes the
          // package run unmodified in a browser.
          maxWebConns: 8,
        });

        source = new TorrentSource(engine, { key: SOURCE_URL, cachePieces: 24 });
        protocol.add(new PMTiles(source));
        log('Reading through the swarm.');
      } else {
        log('Reading over HTTP — ?http is set.');
      }

      document.getElementById('transport').innerHTML = useTorrent
        ? 'transport: <b>swarm</b> · <a href="?http">try HTTP instead</a>'
        : 'transport: <b>HTTP</b> · <a href="?">try the swarm instead</a>';

      // ---------------------------------------------------------------------
      // An ordinary style. Nothing in it knows about BitTorrent: the source is
      // a pmtiles:// URL of the sort maplibre-gl-js has understood since v5,
      // and it renders on a page that never loaded this library at all.
      // ---------------------------------------------------------------------
      const map = new maplibregl.Map({
        container: 'map',
        center: [0, 20],
        zoom: 2,
        style: {
          version: 8,
          sources: {
            archive: { type: 'vector', url: `pmtiles://${SOURCE_URL}` },
          },
          layers: [
            { id: 'bg', type: 'background', paint: { 'background-color': '#dfe7ef' } },
            {
              id: 'water',
              type: 'fill',
              source: 'archive',
              'source-layer': 'water',
              paint: { 'fill-color': '#a8c8e8' },
            },
            {
              id: 'roads',
              type: 'line',
              source: 'archive',
              'source-layer': 'transportation',
              paint: { 'line-color': '#b0a89a', 'line-width': 0.8 },
            },
          ],
        },
      });
      map.addControl(new maplibregl.NavigationControl());
      map.on('error', (event) => log(`map: ${event.error?.message ?? 'unknown'}`));

      const bytes = (value) => {
        if (!value) return '0 B';
        const units = ['B', 'KiB', 'MiB', 'GiB'];
        let size = value;
        let unit = 0;
        while (size >= 1024 && unit < units.length - 1) { size /= 1024; unit += 1; }
        return `${size < 10 && unit > 0 ? size.toFixed(1) : Math.round(size)} ${units[unit]}`;
      };

      // What makes this worth doing is visible here rather than in the map:
      // every piece pulled is a piece served back, so a popular region gets
      // cheaper as more people look at it.
      setInterval(() => {
        if (!useTorrent) return;
        const torrent = client.torrents[0];
        const stats = source.stats;
        document.getElementById('peers').textContent = torrent ? torrent.numPeers : '—';
        document.getElementById('down').textContent = bytes(torrent?.downloaded);
        document.getElementById('up').textContent = bytes(torrent?.uploaded);
        document.getElementById('cache').textContent = stats
          ? `${stats.cacheHits} hit / ${stats.cacheMisses} miss`
          : '—';
      }, 1000);
    </script>
  </body>
</html>
